<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Chandini! 🥳❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow-x:hidden;background:#130b1d;color:#fff}
.page{min-height:100vh;position:relative;display:flex;justify-content:center;align-items:center;
padding:40px 18px;overflow:hidden;
background:
radial-gradient(circle at 50% 15%,rgba(255,142,190,.25),transparent 32%),
radial-gradient(circle at 10% 80%,rgba(155,122,255,.22),transparent 28%),
linear-gradient(145deg,#12091b,#25112f 48%,#11091b)}
.stars,.hearts,.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{transform:scale(.5);opacity:.25}to{transform:scale(1.7);opacity:1}}
.float{position:absolute;font-size:28px;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(20px) rotate(-5deg);opacity:.35}50%{transform:translateY(-70px) rotate(8deg);opacity:.9}}
.card{position:relative;width:min(920px,100%);padding:42px 28px 36px;text-align:center;
border:1px solid rgba(255,255,255,.18);border-radius:36px;
background:rgba(255,255,255,.09);backdrop-filter:blur(18px);
box-shadow:0 30px 100px rgba(0,0,0,.45);animation:cardIn 1.4s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(.94)}to{opacity:1;transform:none}}
.badge{display:inline-block;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.16);font-size:13px;letter-spacing:2px;text-transform:uppercase;
animation:fade 1s .5s both}
h1{margin:18px 0 8px;font-size:clamp(42px,8vw,82px);line-height:.98;
background:linear-gradient(90deg,#ffd1e4,#fff,#ffc0d9,#d9c8ff);
-webkit-background-clip:text;background-clip:text;color:transparent;
animation:title 1.5s .2s cubic-bezier(.16,1,.3,1) both}
@keyframes title{from{opacity:0;transform:translateY(-35px) scale(.85);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.subtitle{font-size:18px;color:#e7d8e8;margin:0 0 30px;animation:fade 1s 1s both}
.photo-wrap{position:relative;width:min(520px,88vw);margin:0 auto;animation:photo 1.8s .55s cubic-bezier(.16,1,.3,1) both}
@keyframes photo{from{opacity:0;transform:translateY(100px) scale(.72) rotate(-3deg);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.photo-wrap:before{content:"";position:absolute;inset:-18px;border-radius:40px;
background:conic-gradient(from 0deg,#ff7fac,#ffd1e5,#a98cff,#ff7fac);filter:blur(18px);opacity:.6;
animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.photo{position:relative;width:100%;display:block;border-radius:30px;border:5px solid rgba(255,255,255,.8);
box-shadow:0 24px 70px rgba(0,0,0,.5)}
.ring{position:absolute;inset:-28px;border:1px dashed rgba(255,255,255,.38);border-radius:45px;
animation:spin 14s linear infinite}
.message{margin:34px auto 0;max-width:720px;color:#f7eaf4;font-size:17px;line-height:1.7;
animation:fade 1s 1.8s both}
.message strong{color:#ffd0e2}
.pills{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px;animation:fade 1s 2s both}
.pill{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
box-shadow:0 8px 20px rgba(0,0,0,.15)}
.bottom{margin-top:28px;font-size:14px;color:#cbb7ca;animation:fade 1s 2.3s both}
.spark{display:inline-block;animation:bounce 1.4s infinite alternate}
@keyframes bounce{to{transform:translateY(-7px) rotate(8deg)}}
canvas{position:absolute;inset:0;pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:1}}

.unicorn {
  position:absolute;
  left:50%;
  top:7%;
  z-index:3;
  font-size:clamp(54px,8vw,82px);
  transform:translateX(-50%);
  filter:drop-shadow(0 8px 18px rgba(255,120,190,.35));
  animation:unicornFloat 3.2s ease-in-out infinite, unicornGlow 2s ease-in-out infinite alternate;
}
.unicorn::after {
  content:"✨";
  position:absolute;
  font-size:.38em;
  right:-22px;
  top:2px;
  animation:sparkle 1.2s ease-in-out infinite alternate;
}
@keyframes unicornFloat {
  0%,100% { transform:translateX(-50%) translateY(0) rotate(-3deg); }
  50% { transform:translateX(-50%) translateY(-16px) rotate(3deg); }
}
@keyframes unicornGlow {
  from { filter:drop-shadow(0 6px 12px rgba(255,120,190,.25)); }
  to { filter:drop-shadow(0 10px 28px rgba(190,140,255,.7)); }
}
@keyframes sparkle {
  from { opacity:.35; transform:scale(.7) rotate(0); }
  to { opacity:1; transform:scale(1.35) rotate(20deg); }
}

.unicorn{
  position:absolute;
  left:4%;
  bottom:7%;
  font-size:clamp(58px,8vw,92px);
  z-index:2;
  filter:drop-shadow(0 12px 18px rgba(255,120,190,.35));
  animation:unicornFloat 3.8s ease-in-out infinite, unicornGlow 2s ease-in-out infinite alternate;
  transform-origin:center;
}
.unicorn::after{
  content:"✨";
  position:absolute;
  font-size:.38em;
  right:-10px;
  top:-8px;
  animation:sparkle 1.2s ease-in-out infinite alternate;
}
@keyframes unicornFloat{
  0%,100%{transform:translateY(8px) rotate(-4deg)}
  50%{transform:translateY(-24px) rotate(4deg)}
}
@keyframes unicornGlow{
  from{filter:drop-shadow(0 8px 12px rgba(255,120,190,.28))}
  to{filter:drop-shadow(0 8px 28px rgba(190,140,255,.7))}
}
@keyframes sparkle{
  from{transform:scale(.65) rotate(-15deg);opacity:.45}
  to{transform:scale(1.3) rotate(15deg);opacity:1}
}
@media(max-width:600px){
  .unicorn{left:2%;bottom:3%;font-size:58px}
}

</style>
</head>

<script>
// Stars
const stars=document.getElementById('stars');
for(let i=0;i<75;i++){
  const s=document.createElement('i'); s.className='star';
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*3)+'s'; stars.appendChild(s);
}

// Gentle confetti burst + continuous floating particles.
const c=document.getElementById('fx'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); addEventListener('resize',resize);
const pieces=[];
function burst(){
  for(let i=0;i<90;i++) pieces.push({
    x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.25,
    vx:(Math.random()-.5)*8,vy:Math.random()*-7-2,
    g:.12+Math.random()*.08,s:4+Math.random()*7,a:1,
    r:Math.random()*Math.PI,c:['#ff8bb5','#ffd166','#b9a2ff','#ffffff'][Math.floor(Math.random()*4)]
  });
}
setTimeout(burst,700); setInterval(burst,7000);
function draw(){
  x.clearRect(0,0,c.width,c.height);
  pieces.forEach(p=>{
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=.08;p.a-=.006;
    x.save();x.globalAlpha=Math.max(0,p.a);x.translate(p.x,p.y);x.rotate(p.r);
    x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);x.restore();
  });
  for(let i=pieces.length-1;i>=0;i--) if(pieces[i].a<=0||pieces[i].y>innerHeight+30) pieces.splice(i,1);
  requestAnimationFrame(draw);
} draw();
</script>
